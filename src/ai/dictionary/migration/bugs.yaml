  das Gericht [ɡəˈʁɪçt]: dish; meal
  Bedeutung: zubereitetes Essen, das als Mahlzeit oder Teil einer Mahlzeit serviert wird.
  Genitiv: des Gerichts
  Plural: die Gerichte
  Kollokation: ein Gericht zubereiten
  Synonyme: Speise, Mahlzeit, Essen
  ex: Dieses Gericht schmeckt sehr gut: This dish tastes very good.
  ex: Ich möchte ein vegetarisches Gericht bestellen: I would like to order a vegetarian dish.

  das Gericht [ɡəˈʁɪçt]: court
  Bedeutung: staatliche Institution, die rechtliche Streitfälle entscheidet und über Straftaten urteilt.
  Genitiv: des Gerichts
  Plural: die Gerichte
  Kollokation: vor Gericht stehen
  Synonyme: Rechtsprechungsorgan, Justizbehörde
  ex: Der Fall wird vor Gericht verhandelt: The case is being heard in court.
  ex: Das Gericht hat eine Entscheidung getroffen: The court made a decision.
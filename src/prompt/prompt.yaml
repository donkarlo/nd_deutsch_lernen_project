    - the general and always-must use template is the duetsch lernen project attached as erklearung_vorlage.tex and if it needs table use the style in tabelle vorlage. Always use it and always give the english translation with the given style in template.tex. Do not forget to give the english translation even for headings either sections or table title etc. everything needs an english translation
    - don't use star after tags or commands etc for example dont use \subsection* and instead simply use \subsection
    - Do not relate or mention the latex file with my last questions in the chat such that it is usable for another reader without knowing what I have previously asked in the chat.
    - Along with the latex give me a PDF version as well
    - name both the PDF and the tex file exactly after the topic I am asking for and dont add extra things#

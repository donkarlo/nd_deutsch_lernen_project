    25:
      Subject: |
        Sollte Arbeit nur ein Mittel zum Geldverdienen sein oder auch Sinn im Leben geben?
      Text: |
        Die Frage, dass die Arbeit ist nur um Geld zu verdienen oder ein Man muss der geniessen ist etwas der immer ich im mein Meinung haben. Was muss ich machen dass ich genieße mich und ich productiv sein und der Menschen in der Welt sich sagen, diese Junge Mann ist ein wichtiges Person in der Welt. Wichtig als der Berg Everest. Deshalb ich immer nach Wissentschftlischer arbeiten suchen, sodass ich can immer etwas lernen. Ich habe so viel in einge Stell mit gut Gehalt aber ich kontte nicht die versetzen weil ich nichx gelerned habe. Wann immer ich sehe in Fernsehen die Menchen in einige östliche Landen die sie arbeiten an etwas sehr repetitive und korperlisch, ich sage mich selbst wenn ich verdine ein million euro von diese Stelle ich möchte nicht mein Leben an es wieden. Aber ich bin ledig, vileicht wann ich ein Ehepaar haben, ich denke nicht so viel an die the Herstellung die arbeit. Ich vorsetze  zu arbeiten bis ich find dass es ist um die Uhr dass ich nach Haus gehen kann um mein Frau zu besuchen. Wir setzen zusammen und wir sprechen und wir gehen zu einkaufen. Der leben wird repetitiv aber vielleict es gut ist. Wiederhulung wenn mann nicht allein ist muss nicht als schelcht as wann mann ist allein. Aber die Arbeit ist die Wischtigeste dinge in der Welt wovon man Sinn finden kann. Wenn mann verlier der Arbeit als Mittle um in Sinn Leben, dann nicht zu viel zeit bleibt fur er. Mann denkst ständing, sie hat etwas verleirt und sie habe keine Wahle aber  warten zu storben
